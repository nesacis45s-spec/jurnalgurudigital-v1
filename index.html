<!DOCTYPE html>
<html lang="id">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Jurnal Harian Guru Digital — Offline</title>

<!-- CDN Libraries -->
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="manifest" href="/manifest.json">
<link rel="manifest" href="/app.webmanifest" crossorigin="use-credentials" />
  
<style>
:root{
  --blue-50:#eff6ff; --blue-100:#dbeafe; --blue-500:#2563eb; --blue-600:#1d4ed8;
  --blue-700:#1e40af; --blue-900:#1e3a5f;
  --navy:#12294d;
  --gray-50:#f8fafc; --gray-100:#f1f5f9; --gray-200:#e2e8f0; --gray-400:#94a3b8;
  --gray-500:#64748b; --gray-700:#334155; --gray-900:#0f172a;
  --green:#16a34a; --green-bg:#dcfce7;
  --red:#dc2626; --red-bg:#fee2e2;
  --yellow:#d97706; --yellow-bg:#fef3c7;
  --blue-info:#2563eb; --blue-info-bg:#dbeafe;
  --bg:#f5f7fb; --surface:#ffffff; --text:#0f172a; --text-muted:#64748b;
  --border:#e2e8f0; --radius:12px; --shadow:0 1px 3px rgba(15,23,42,.08), 0 1px 2px rgba(15,23,42,.04);
  --shadow-md:0 4px 14px rgba(15,23,42,.08);
  --sidebar-w:250px;
}
[data-theme="dark"]{
  --bg:#0b1220; --surface:#141c2e; --text:#e6ebf5; --text-muted:#94a3b8;
  --border:#243149; --gray-50:#0f1729; --gray-100:#1a2338;
  --shadow:0 1px 3px rgba(0,0,0,.4); --shadow-md:0 4px 16px rgba(0,0,0,.45);
  --blue-50:#152238;--blue-100:#1c2b47;
  --green-bg:#0f2e1c; --red-bg:#3a1418; --yellow-bg:#3a2a0c; --blue-info-bg:#152238;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font-family:'Inter',system-ui,sans-serif;
  background:var(--bg); color:var(--text);
  -webkit-font-smoothing:antialiased;
  min-height:100vh;
}
h1,h2,h3,.font-display{font-family:'Plus Jakarta Sans',system-ui,sans-serif;}
#app-root{min-height:100vh;}
button{font-family:inherit; cursor:pointer;}
input,select,textarea{font-family:inherit;}
::selection{background:var(--blue-100);}

/* ---------- Utility layout ---------- */
.hidden{display:none !important;}
.flex{display:flex;} .flex-col{flex-direction:column;} .items-center{align-items:center;}
.justify-between{justify-content:space-between;} .justify-center{justify-content:center;}
.gap-2{gap:8px;} .gap-3{gap:12px;} .gap-4{gap:16px;}
.w-full{width:100%;}
.grid{display:grid;}

/* ---------- Auth ---------- */
#auth-view{
  min-height:100vh; display:flex; align-items:center; justify-content:center;
  background:linear-gradient(160deg,var(--blue-900) 0%, var(--blue-700) 45%, var(--blue-500) 100%);
  padding:20px;
}
.auth-card{
  background:var(--surface); width:100%; max-width:400px; border-radius:20px;
  padding:40px 32px; box-shadow:0 24px 60px rgba(10,20,50,.35);
}
.auth-logo{font-size:44px; text-align:center; margin-bottom:6px;}
.auth-title{text-align:center; font-size:22px; font-weight:800; color:var(--blue-900); margin:0 0 4px;}
.auth-sub{text-align:center; font-size:13.5px; color:var(--text-muted); margin:0 0 28px;}
.field{margin-bottom:16px;}
.field label{display:block; font-size:13px; font-weight:600; color:var(--gray-700); margin-bottom:6px;}
.field input, .field select{
  width:100%; padding:11px 14px; border:1.5px solid var(--border); border-radius:10px;
  font-size:14.5px; background:var(--surface); color:var(--text); transition:border-color .15s;
}
.field input:focus, .field select:focus{outline:none; border-color:var(--blue-500); box-shadow:0 0 0 3px var(--blue-100);}
.pw-wrap{position:relative;}
.pw-toggle{position:absolute; right:12px; top:50%; transform:translateY(-50%); background:none; border:none; font-size:13px; color:var(--blue-600); font-weight:600;}
.btn{
  display:inline-flex; align-items:center; justify-content:center; gap:8px;
  padding:11px 18px; border-radius:10px; border:none; font-weight:700; font-size:14.5px;
  transition:transform .05s, box-shadow .15s, background .15s; white-space:nowrap;
}
.btn:active{transform:scale(0.98);}
.btn-primary{background:var(--blue-600); color:#fff; box-shadow:0 6px 16px rgba(37,99,235,.3);}
.btn-primary:hover{background:var(--blue-700);}
.btn-block{width:100%;}
.btn-secondary{background:var(--gray-100); color:var(--gray-700);}
.btn-secondary:hover{background:var(--gray-200);}
.btn-outline{background:transparent; border:1.5px solid var(--border); color:var(--text);}
.btn-outline:hover{background:var(--gray-50);}
.btn-danger{background:var(--red); color:#fff;}
.btn-danger:hover{background:#b91c1c;}
.btn-sm{padding:7px 12px; font-size:13px; border-radius:8px;}
.btn-icon{padding:8px; border-radius:8px; background:var(--gray-100); border:none;}
.btn:disabled{opacity:.55; cursor:not-allowed;}
.auth-link{display:block; text-align:center; margin-top:18px; color:var(--blue-600); font-weight:600; font-size:13.5px; text-decoration:none; background:none; border:none; width:100%;}
.auth-switch{margin-top:14px;}

/* ---------- App shell ---------- */
#app-view{display:flex; min-height:100vh;}
#sidebar{
  width:var(--sidebar-w); background:var(--navy); color:#dbe4f5; flex-shrink:0;
  display:flex; flex-direction:column; position:fixed; top:0; bottom:0; left:0; z-index:40;
  transition:transform .2s;
}
.sb-brand{padding:22px 20px 16px; display:flex; align-items:center; gap:10px; border-bottom:1px solid rgba(255,255,255,.08);}
.sb-brand .emoji{font-size:26px;}
.sb-brand-text{font-weight:800; font-size:15px; color:#fff; line-height:1.25;}
.sb-brand-sub{font-size:11px; color:#9db3d6;}
.sb-nav{flex:1; overflow-y:auto; padding:14px 12px;}
.sb-link{
  display:flex; align-items:center; gap:12px; padding:11px 14px; border-radius:10px;
  color:#c4d2ea; text-decoration:none; font-size:14px; font-weight:600; margin-bottom:3px;
  border:none; background:none; width:100%; text-align:left;
}
.sb-link:hover{background:rgba(255,255,255,.06); color:#fff;}
.sb-link.active{background:var(--blue-600); color:#fff;}
.sb-link .ico{font-size:16px; width:20px; text-align:center;}
.sb-foot{padding:14px 20px 20px; border-top:1px solid rgba(255,255,255,.08); font-size:11px; color:#7f93b8;}

#main-col{flex:1; margin-left:var(--sidebar-w); display:flex; flex-direction:column; min-width:0; max-width:100%;}
html,body{overflow-x:hidden; width:100%;}
#topbar{
  background:var(--surface); border-bottom:1px solid var(--border); padding:12px 24px;
  display:flex; align-items:center; justify-content:space-between; gap:16px; position:sticky; top:0; z-index:30;
}
.breadcrumb{font-size:12px; color:var(--text-muted);}
.hamburger{display:none; background:none; border:none; font-size:20px; color:var(--text);}
.gsearch{
  flex:1; max-width:380px; position:relative;
}
.gsearch input{
  width:100%; padding:9px 14px 9px 34px; border-radius:9px; border:1.5px solid var(--border);
  background:var(--gray-50); font-size:13.5px; color:var(--text);
}
.gsearch .gs-ico{position:absolute; left:11px; top:50%; transform:translateY(-50%); color:var(--text-muted); font-size:14px;}
.gsearch .kbd{position:absolute; right:9px; top:50%; transform:translateY(-50%); font-size:10.5px; color:var(--text-muted); background:var(--gray-100); border:1px solid var(--border); border-radius:5px; padding:1px 6px;}
.gs-results{
  position:absolute; top:calc(100% + 6px); left:0; right:0; background:var(--surface); border:1px solid var(--border);
  border-radius:10px; box-shadow:var(--shadow-md); max-height:340px; overflow-y:auto; z-index:60;
}
.gs-item{padding:10px 14px; font-size:13.5px; border-bottom:1px solid var(--border); cursor:pointer;}
.gs-item:last-child{border-bottom:none;}
.gs-item:hover{background:var(--gray-50);}
.gs-item small{display:block; color:var(--text-muted); font-size:11.5px; margin-top:2px;}

.topbar-right{display:flex; align-items:center; gap:10px;}
.icon-btn{background:var(--gray-100); border:none; width:38px; height:38px; border-radius:10px; font-size:16px; display:flex; align-items:center; justify-content:center; color:var(--text);}
.icon-btn:hover{background:var(--gray-200);}
.user-chip{display:flex; align-items:center; gap:8px; padding:6px 10px 6px 6px; border-radius:99px; background:var(--gray-100); border:none;}
.avatar{width:30px; height:30px; border-radius:99px; background:var(--blue-600); color:#fff; display:flex; align-items:center; justify-content:center; font-weight:700; font-size:12.5px;}
.user-chip-text{text-align:left;}
.user-chip-text .name{font-size:12.5px; font-weight:700; color:var(--text); line-height:1.2;}
.user-chip-text .role{font-size:10.5px; color:var(--text-muted);}

#content{padding:24px; flex:1; max-width:1400px; width:100%; margin:0 auto; min-width:0;}
.page-title{font-size:22px; font-weight:800; margin:0 0 2px;}
.page-sub{font-size:13.5px; color:var(--text-muted); margin:0 0 22px;}

/* ---------- Cards / grid ---------- */
.stat-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(190px,1fr)); gap:16px; margin-bottom:22px;}
.stat-card{background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:18px; box-shadow:var(--shadow);}
.stat-card .si{width:38px; height:38px; border-radius:10px; display:flex; align-items:center; justify-content:center; font-size:18px; margin-bottom:10px;}
.stat-card .sv{font-size:24px; font-weight:800; line-height:1;}
.stat-card .sl{font-size:12.5px; color:var(--text-muted); margin-top:5px; font-weight:600;}

.card{background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); box-shadow:var(--shadow); padding:20px; margin-bottom:20px;}
.card-head{display:flex; align-items:center; justify-content:between; justify-content:space-between; margin-bottom:16px;}
.card-title{font-size:15.5px; font-weight:700; margin:0;}

.chart-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(320px,1fr)); gap:18px; margin-bottom:22px;}
.chart-box{height:230px; position:relative;}
.empty-chart{display:flex; align-items:center; justify-content:center; height:100%; color:var(--text-muted); font-size:13px; text-align:center;}

.qa-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(140px,1fr)); gap:12px; margin-bottom:22px;}
.qa-btn{
  background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:18px 12px;
  text-align:center; box-shadow:var(--shadow); font-weight:700; font-size:13px; color:var(--text);
}
.qa-btn:hover{border-color:var(--blue-500); background:var(--blue-50);}
.qa-btn .qa-emoji{font-size:24px; display:block; margin-bottom:8px;}

/* ---------- Tables ---------- */
.table-wrap{overflow-x:auto;}
table{width:100%; border-collapse:collapse; font-size:13.5px;}
th{text-align:left; padding:11px 12px; background:var(--gray-50); color:var(--text-muted); font-weight:700; font-size:11.5px; text-transform:uppercase; letter-spacing:.03em; border-bottom:1px solid var(--border); white-space:nowrap;}
td{padding:11px 12px; border-bottom:1px solid var(--border); vertical-align:middle;}
tr:last-child td{border-bottom:none;}
tbody tr:hover{background:var(--gray-50);}
.badge{display:inline-flex; align-items:center; gap:4px; padding:3px 10px; border-radius:99px; font-size:11.5px; font-weight:700;}
.badge-green{background:var(--green-bg); color:var(--green);}
.badge-red{background:var(--red-bg); color:var(--red);}
.badge-yellow{background:var(--yellow-bg); color:var(--yellow);}
.badge-blue{background:var(--blue-info-bg); color:var(--blue-info);}
.badge-gray{background:var(--gray-100); color:var(--gray-500);}
.row-actions{display:flex; gap:6px; flex-wrap:wrap;}
.row-actions button{background:var(--gray-100); border:none; width:30px; height:30px; border-radius:8px; font-size:13px;}
.row-actions button:hover{background:var(--gray-200);}

.toolbar{display:flex; flex-wrap:wrap; gap:10px; align-items:center; margin-bottom:16px;}
.toolbar input[type=text], .toolbar select, .toolbar input[type=date]{
  padding:9px 12px; border:1.5px solid var(--border); border-radius:9px; font-size:13.5px; background:var(--surface); color:var(--text);
}
.toolbar .search-box{position:relative; flex:1; min-width:200px;}
.toolbar .search-box input{width:100%; padding-left:32px;}
.toolbar .search-box .ico{position:absolute; left:10px; top:50%; transform:translateY(-50%); color:var(--text-muted); font-size:13px;}

.mobile-cards{display:none;}
.m-jcard{background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:14px; margin-bottom:10px; box-shadow:var(--shadow);}
.m-jcard-top{display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:6px;}
.m-jcard .mj-date{font-weight:700; font-size:13.5px;}
.m-jcard .mj-meta{font-size:12px; color:var(--text-muted); margin:3px 0 8px;}
.m-jcard .mj-materi{font-size:13.5px; margin-bottom:10px;}

.empty-state{text-align:center; padding:60px 20px; color:var(--text-muted);}
.empty-state .es-emoji{font-size:44px; margin-bottom:14px;}
.empty-state .es-title{font-size:15.5px; font-weight:700; color:var(--text); margin-bottom:16px;}

/* ---------- Modal ---------- */
.modal-backdrop{
  position:fixed; inset:0; background:rgba(10,15,30,.55); z-index:100; display:flex;
  align-items:center; justify-content:center; padding:16px; backdrop-filter:blur(1px);
}
.modal{
  background:var(--surface); border-radius:16px; width:100%; max-width:640px; max-height:88vh;
  display:flex; flex-direction:column; box-shadow:0 30px 70px rgba(0,0,0,.35);
}
.modal.modal-lg{max-width:880px;}
.modal-head{display:flex; align-items:center; justify-content:space-between; padding:18px 22px; border-bottom:1px solid var(--border);}
.modal-head h3{margin:0; font-size:16.5px; font-weight:800;}
.modal-close{background:var(--gray-100); border:none; width:30px; height:30px; border-radius:8px; font-size:15px;}
.modal-body{padding:20px 22px; overflow-y:auto;}
.modal-foot{padding:16px 22px; border-top:1px solid var(--border); display:flex; justify-content:flex-end; gap:10px;}

.form-grid{display:grid; grid-template-columns:1fr 1fr; gap:14px;}
.form-grid .full{grid-column:1/-1;}
@media (max-width:560px){.form-grid{grid-template-columns:1fr;}}
textarea{width:100%; padding:11px 14px; border:1.5px solid var(--border); border-radius:10px; font-size:14px; resize:vertical; min-height:80px; background:var(--surface); color:var(--text);}

/* ---------- Loading overlay ---------- */
#loading-overlay{
  position:fixed; inset:0; background:rgba(10,15,30,.45); z-index:9999; display:none;
  align-items:center; justify-content:center; flex-direction:column; color:#fff; backdrop-filter:blur(2px);
}
#loading-overlay.show{display:flex;}
.spin{font-size:34px; animation:spin 1s linear infinite; margin-bottom:10px;}
@keyframes spin{to{transform:rotate(360deg);}}

/* ---------- Toggle switch ---------- */
.toggle{position:relative; display:inline-block; width:44px; height:24px;}
.toggle input{opacity:0; width:0; height:0;}
.toggle .slider{position:absolute; inset:0; background:var(--gray-200); border-radius:99px; transition:.2s;}
.toggle .slider:before{content:""; position:absolute; height:18px; width:18px; left:3px; top:3px; background:#fff; border-radius:50%; transition:.2s;}
.toggle input:checked + .slider{background:var(--blue-600);}
.toggle input:checked + .slider:before{transform:translateX(20px);}

/* ---------- Attendance summary ---------- */
.att-summary{display:grid; grid-template-columns:repeat(4,1fr); gap:10px; margin-bottom:16px;}
.att-chip{border-radius:12px; padding:12px; text-align:center; font-weight:700;}
.att-h{background:var(--green-bg); color:var(--green);}
.att-i{background:var(--blue-info-bg); color:var(--blue-info);}
.att-s{background:var(--yellow-bg); color:var(--yellow);}
.att-a{background:var(--red-bg); color:var(--red);}
.att-chip .n{font-size:20px;}
.att-status-btns{display:flex; gap:4px;}
.st-btn{width:32px; height:32px; border-radius:8px; border:1.5px solid var(--border); background:var(--surface); font-weight:800; font-size:12px; color:var(--text-muted);}
.st-btn.active-h{background:var(--green); color:#fff; border-color:var(--green);}
.st-btn.active-i{background:var(--blue-info); color:#fff; border-color:var(--blue-info);}
.st-btn.active-s{background:var(--yellow); color:#fff; border-color:var(--yellow);}
.st-btn.active-a{background:var(--red); color:#fff; border-color:var(--red);}

/* ---------- Calendar ---------- */
.cal-grid{display:grid; grid-template-columns:repeat(7,1fr); gap:6px;}
.cal-dow{text-align:center; font-size:11px; font-weight:700; color:var(--text-muted); padding:6px 0; text-transform:uppercase;}
.cal-cell{min-height:74px; border:1px solid var(--border); border-radius:10px; padding:6px; font-size:12px; position:relative; background:var(--surface);}
.cal-cell.empty{background:transparent; border:none;}
.cal-cell.today{border-color:var(--blue-500); box-shadow:0 0 0 2px var(--blue-100);}
.cal-cell .cd-num{font-weight:700; font-size:12.5px;}
.cal-cell.has-journal{cursor:pointer; background:var(--blue-50);}
.cal-dot{width:6px; height:6px; border-radius:50%; background:var(--blue-600); position:absolute; bottom:6px; right:6px;}

/* ---------- Bottom nav (mobile) ---------- */
#bottom-nav{
  display:none; position:fixed; bottom:0; left:0; right:0; background:var(--surface); border-top:1px solid var(--border);
  z-index:50; padding:6px 4px; justify-content:space-around;
}
.bn-item{display:flex; flex-direction:column; align-items:center; gap:2px; background:none; border:none; color:var(--text-muted); font-size:10px; font-weight:600; padding:6px 4px; flex:1;}
.bn-item.active{color:var(--blue-600);}
.bn-item .bi-ico{font-size:18px;}

#sidebar-backdrop{display:none; position:fixed; inset:0; background:rgba(0,0,0,.4); z-index:35;}

/* ---------- Responsive ---------- */
@media (max-width:900px){
  #sidebar{transform:translateX(-100%);}
  #sidebar.open{transform:translateX(0);}
  #main-col{margin-left:0;}
  .hamburger{display:block;}
  #bottom-nav{display:flex;}
  #content{padding-bottom:80px;}
  .gsearch{max-width:none; min-width:0; flex:1;}
  .gsearch .kbd{display:none;}
  .gsearch input{padding-right:10px;}
  .user-chip-text{display:none;}
  #topbar{padding:10px 12px; gap:8px;}
  .topbar-right{gap:6px; flex-shrink:0;}
  .icon-btn, .user-chip{flex-shrink:0;}
  #content{padding:16px;}
  .card{padding:16px;}
}
@media (max-width:700px){
  .table-wrap.responsive-cards table{display:none;}
  .mobile-cards{display:block;}
  .att-summary{grid-template-columns:repeat(2,1fr);}
}

/* ---------- Print ---------- */
@media print{
  #sidebar,#topbar,#bottom-nav,.no-print,.qa-grid,#loading-overlay{display:none !important;}
  #main-col{margin-left:0 !important;}
  body{background:#fff !important;}
  #content{padding:0; max-width:100%;}
  .card{box-shadow:none; border:1px solid #ccc;}
  @page{size:A4; margin:14mm;}
}

.spinner-inline{display:inline-block; width:14px; height:14px; border:2px solid rgba(255,255,255,.4); border-top-color:#fff; border-radius:50%; animation:spin .7s linear infinite;}
.chip-list{display:flex; flex-wrap:wrap; gap:8px;}
.template-chip{padding:8px 14px; border-radius:99px; border:1.5px solid var(--border); background:var(--surface); font-size:13px; font-weight:600;}
.template-chip:hover{border-color:var(--blue-500); background:var(--blue-50);}
.pager{display:flex; align-items:center; justify-content:space-between; margin-top:14px; font-size:13px; color:var(--text-muted);}
.small-muted{font-size:12px; color:var(--text-muted);}
</style>
</head>
<body>
<div id="app-root">

  <!-- ============ LOADING OVERLAY ============ -->
  <div id="loading-overlay">
    <div class="spin">⟳</div>
    <div id="loading-text">Memproses data...</div>
  </div>

  <!-- ============ MAIN APP VIEW ============ -->
  <div id="app-view">
    <div id="sidebar-backdrop"></div>
    <aside id="sidebar">
      <div class="sb-brand">
        <div class="emoji">🎓</div>
        <div>
          <div class="sb-brand-text">Jurnal Harian<br>Guru Digital</div>
          <div class="sb-brand-sub">Administrasi Pembelajaran</div>
        </div>
      </div>
      <nav class="sb-nav" id="sb-nav"></nav>
      <div class="sb-foot">© 2026 · Jurnal Harian Guru Digital</div>
    </aside>

    <div id="main-col">
      <header id="topbar">
        <button class="hamburger" id="btn-hamburger">☰</button>
        <div class="gsearch">
          <span class="gs-ico">🔎</span>
          <input type="text" id="global-search" placeholder="Cari jurnal, siswa, kelas...">
          <span class="kbd">Ctrl K</span>
          <div id="gs-results" class="gs-results hidden"></div>
        </div>

/* =========================================================================
   2. GENERIC UTILITIES
   ========================================================================= */
const $ = (sel, root=document) => root.querySelector(sel);
const $$ = (sel, root=document) => Array.from(root.querySelectorAll(sel));
const el = (tag, attrs={}, html) => {
  const e = document.createElement(tag);
  Object.entries(attrs).forEach(([k,v]) => { if(k==='class') e.className=v; else e.setAttribute(k,v); });
  if (html !== undefined) e.innerHTML = html;
  return e;
};
function escapeHtml(str){
  if (str === null || str === undefined) return "";
  return String(str).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}
function uid(prefix="id"){ return prefix + "_" + Date.now().toString(36) + "_" + Math.random().toString(36).slice(2,8); }
function todayISO(){ const d = new Date(); return d.toISOString().slice(0,10); }
function formatDateID(iso){
  if (!iso) return "-";
  const d = new Date(iso + "T00:00:00");
  if (isNaN(d)) return iso;
  return d.toLocaleDateString("id-ID", { day:"2-digit", month:"long", year:"numeric" });
}
function formatDateShort(iso){
  if (!iso) return "-";
  const d = new Date(iso + "T00:00:00");
  if (isNaN(d)) return iso;
  return d.toLocaleDateString("id-ID", { day:"2-digit", month:"short", year:"numeric" });
}
function debounce(fn, wait=300){
  let t;
  return (...args) => { clearTimeout(t); t = setTimeout(()=>fn(...args), wait); };
}
function initials(name){
  if (!name) return "G";
  const parts = name.trim().split(/\s+/);
  return ((parts[0]?.[0]||"") + (parts[1]?.[0]||"")).toUpperCase() || "G";
}
function saveLocal(key, val){ try{ localStorage.setItem(key, JSON.stringify(val)); }catch(e){ console.error(e); } }
function loadLocal(key, fallback=null){ try{ const v = localStorage.getItem(key); return v ? JSON.parse(v) : fallback; }catch(e){ return fallback; } }
function removeLocal(key){ try{ localStorage.removeItem(key); }catch(e){} }

function toast(icon, title){
  if (window.Swal) {
    Swal.fire({ icon, title, toast:true, position:'top-end', showConfirmButton:false, timer:2600, timerProgressBar:true });
  } else {
    console.log(`[${icon}] ${title}`);
  }
}
function notifySuccess(msg){ toast('success', msg); }
function notifyError(msg){ toast('error', msg); }
function notifyWarning(msg){ toast('warning', msg); }
function notifyInfo(msg){ toast('info', msg); }

async function confirmDialog(title, text, confirmText="Ya, lanjutkan", icon="warning"){
  if (window.Swal){
    const res = await Swal.fire({
      title, text, icon, showCancelButton:true,
      confirmButtonText: confirmText, cancelButtonText:"Batal",
      confirmButtonColor:"#dc2626", cancelButtonColor:"#64748b"
    });
    return res.isConfirmed;
  }
  return window.confirm(title + "\n" + text);
}

/* =========================================================================
   3. LOADING SYSTEM
   ========================================================================= */
let loadingCount = 0;
function showLoading(text="Memproses data..."){
  loadingCount++;
  $("#loading-text").textContent = text;
  $("#loading-overlay").classList.add("show");
  setFormsDisabled(true);
}
function hideLoading(){
  loadingCount = Math.max(0, loadingCount-1);
  if (loadingCount === 0){
    $("#loading-overlay").classList.remove("show");
    setFormsDisabled(false);
  }
}
function setFormsDisabled(disabled){
  $$("button, input, select, textarea").forEach(elm=>{
    if (elm.closest("#loading-overlay")) return;
    if (disabled) { if(!elm.disabled){ elm.dataset.wasEnabled="1"; elm.disabled=true; } }
    else { if (elm.dataset.wasEnabled){ elm.disabled=false; delete elm.dataset.wasEnabled; } }
  });
}

/* =========================================================================
   4. API REQUEST SYSTEM (dipakai khusus untuk mengambil data siswa secara online)
   ========================================================================= */
async function apiRequest(url, options = {}) {
  const { method="GET", timeout=CONFIG.REQUEST_TIMEOUT_MS, retries=CONFIG.RETRY_LIMIT, silent=false } = options;
  let attempt = 0;
  while (true) {
    attempt++;
    const controller = new AbortController();
    const timer = setTimeout(()=>controller.abort(), timeout);
    try {
      const res = await fetch(url, { method, signal: controller.signal, cache:"reload" });
      clearTimeout(timer);
      if (!res.ok) throw Object.assign(new Error(`HTTP ${res.status}`), { httpStatus: res.status });
      const raw = await res.text();
      if (!raw || !raw.trim()) return { ok:true, empty:true };
      try { return { ok:true, data: JSON.parse(raw) }; }
      catch(parseErr){ return { ok:true, empty:true, raw }; }
    } catch (err) {
      clearTimeout(timer);
      const isAbort = err.name === "AbortError";
      if (attempt <= retries) { continue; }
      if (!silent) {
        notifyError(isAbort
          ? "Server membutuhkan waktu terlalu lama. Silakan coba lagi."
          : "Gagal terhubung ke server. Periksa koneksi internet Anda.");
      }
      return { ok:false, error: err, aborted:isAbort };
    }
  }
}

/* =========================================================================
   5. STUDENT DATA: LOCAL STORAGE + PENGAMBILAN ONLINE (SEKALI TARIK)
   ========================================================================= */
function getUniqueClasses(students){
  const set = new Set(students.map(s => s.kelas).filter(Boolean));
  return Array.from(set).sort((a,b)=> a.localeCompare(b, 'id', {numeric:true}));
}

function normalizeStudentRecord(s){
  return {
    nis: (s.nis||"").toString().trim(),
    nisn: (s.nisn||"").toString().trim(),
    nama: (s.nama||"").toString().trim(),
    jenisKelamin: (s.jenisKelamin||"").toString().trim(),
    kelas: (s.kelas||"").toString().trim()
  };
}

function loadStudentsFromDevice(){
  const students = loadLocal(STORAGE_KEYS.STUDENTS, []);
  appState.students = Array.isArray(students) ? students : [];
  appState.classes = getUniqueClasses(appState.students);
  return appState.students;
}

function persistStudents(){
  saveLocal(STORAGE_KEYS.STUDENTS, appState.students);
  appState.classes = getUniqueClasses(appState.students);
}

/**
 * Mengambil data siswa dari sumber ONLINE (tidak langsung menyimpan ke perangkat).
 * Mengembalikan { ok, students, count } agar UI bisa menampilkan pop-up konfirmasi
 * jumlah siswa yang berhasil ditarik sebelum benar-benar disimpan ke perangkat.
 */
async function fetchStudentsOnline(){
  showLoading("Mengambil data siswa dari server...");
  const res = await apiRequest(CONFIG.STUDENT_API_URL, { silent:true });
  hideLoading();
  if (!res.ok || !res.data){
    notifyError("Data siswa belum dapat diambil. Periksa koneksi internet lalu coba lagi.");
    return { ok:false, students:[], count:0 };
  }
  const json = res.data;
  if (json && json.success === false){
    notifyError(json.message || "Gagal mengambil data siswa.");
    return { ok:false, students:[], count:0 };
  }
  const list = Array.isArray(json) ? json : (json.data || json.students || []);
  const students = (list || []).map(normalizeStudentRecord).filter(s => s.nama);
  return { ok:true, students, count: students.length };
}

/**
 * Menggabungkan hasil tarikan online ke data siswa yang sudah ada di perangkat.
 * PERFORMANT: menggunakan Map (lookup O(1)) berdasarkan NISN alih-alih pencarian
 * berulang (Array.find) sehingga tetap cepat meski jumlah siswa besar.
 * - NISN yang sudah ada di perangkat -> DILEWATI (tidak diduplikasi).
 * - NISN baru / tidak ditemukan -> DITAMBAHKAN.
 */
function mergeAndSaveStudents(fetchedStudents){
  const existingMap = new Map();
  appState.students.forEach(s => { if (s.nisn) existingMap.set(s.nisn, s); });

  let added = 0, skipped = 0;
  const toAdd = [];
  fetchedStudents.forEach(s => {
    if (s.nisn && existingMap.has(s.nisn)) { skipped++; return; }
    if (s.nisn) existingMap.set(s.nisn, s); // cegah duplikat di dalam batch tarikan yang sama
    toAdd.push(s);
    added++;
  });

  // Satu operasi array + satu kali penulisan localStorage (bukan per-item) untuk performa terbaik.
  appState.students = appState.students.concat(toAdd);
  persistStudents();

  return { added, skipped, total: appState.students.length };
}

/**
 * Alur UI lengkap untuk poin 3 & 4:
 * 1) Tarik data siswa dari sumber online.
 * 2) Tampilkan pop-up berisi JUMLAH siswa yang berhasil ditarik.
 * 3) Setelah pengguna menekan "Simpan", baru data digabungkan & disimpan ke
 *    perangkat, dengan pengecekan NISN duplikat (dilewati) vs baru (ditambahkan).
 */
async function handleFetchStudentsFlow(){
  const result = await fetchStudentsOnline();
  if (!result.ok) return;

  if (!result.count){
    notifyWarning("Tidak ada data siswa yang ditemukan pada sumber online.");
    return;
  }

  if (!window.Swal){
    // Fallback tanpa SweetAlert2
    const proceed = window.confirm(`Berhasil menarik ${result.count} data siswa dari server.\n\nSimpan ke perangkat sekarang?`);
    if (proceed) {
      const r = mergeAndSaveStudents(result.students);
      notifySuccess(`Tersimpan. ${r.added} siswa baru ditambahkan, ${r.skipped} dilewati (NISN sudah ada).`);
      renderPage();
    }
    return;
  }

  const swalResult = await Swal.fire({
    icon: "success",
    title: "Data Siswa Ditemukan",
    html: `<div style="text-align:left;font-size:14px;line-height:1.7;">
             Jumlah siswa yang berhasil <b>ditarik dari server</b>:
             <div style="text-align:center;font-size:30px;font-weight:800;color:#2563eb;margin:10px 0;">${result.count}</div>
             <div class="small-muted" style="text-align:center;">
               Tekan <b>Simpan</b> untuk menyimpan ke perangkat.<br>
               NISN yang sudah ada di perangkat akan otomatis dilewati (tidak diduplikasi).
             </div>
           </div>`,
    showCancelButton: true,
    confirmButtonText: "💾 Simpan ke Perangkat",
    cancelButtonText: "Batal",
    confirmButtonColor: "#2563eb",
    cancelButtonColor: "#64748b"
  });

  if (!swalResult.isConfirmed) return;

  showLoading("Menyimpan data siswa ke perangkat...");
  const r = mergeAndSaveStudents(result.students);
  hideLoading();

  await Swal.fire({
    icon: "success",
    title: "Data Siswa Tersimpan",
    html: `<div style="text-align:left;font-size:13.5px;line-height:1.8;">
             <div>✅ Ditambahkan (baru): <b>${r.added}</b></div>
             <div>⏭️ Dilewati (NISN sudah ada): <b>${r.skipped}</b></div>
             <div>👥 Total siswa di perangkat sekarang: <b>${r.total}</b></div>
           </div>`,
    confirmButtonText: "OK",
    confirmButtonColor: "#2563eb"
  });
  renderPage();
}

function navigateTo(page){

function renderPage(){
  const content = $("#content");
  const [title, sub] = PAGE_TITLES[appState.currentPage] || ["", ""];
  let bodyHtml = "";
  switch(appState.currentPage){
    case "dashboard": bodyHtml = renderDashboardPage(); break;
    case "jurnal": bodyHtml = renderJournalListPage(); break;
    case "kalender": bodyHtml = renderCalendarPage(); break;
    case "rekap": bodyHtml = renderRecapPage(); break;
    case "profil": bodyHtml = renderProfilePage(); break;
    case "backup": bodyHtml = renderBackupPage(); break;
    case "pengaturan": bodyHtml = renderSettingsPage(); break;
    default: bodyHtml = renderDashboardPage();
  }
  content.innerHTML = `
    <div class="breadcrumb">Dashboard / ${title}</div>
    <h1 class="page-title" style="margin-top:6px;">${title}</h1>
    <p class="page-sub">${sub}</p>
    ${bodyHtml}
  `;
  afterPageRender();
}

function afterPageRender(){
  if (appState.currentPage === "dashboard") { initDashboardCharts(); bindQuickActions(); }

  if (appState.currentPage === "kalender") { bindCalendarEvents(); }

  if (appState.currentPage === "profil") { bindProfileEvents(); }
  if (appState.currentPage === "backup") { bindBackupEvents(); }
  if (appState.currentPage === "pengaturan") { bindSettingsEvents(); }
}

/* ---------- Theme (Dark Mode) ---------- */
function applyTheme(){
  const t = appState.settings.theme;
  let effective = t;
  if (t === "system") {
    effective = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
  }
  document.documentElement.setAttribute("data-theme", effective);
  $("#btn-theme").textContent = effective === "dark" ? "☀️" : "🌙";
  Object.values(appState.charts).forEach(c => { try { c.update(); } catch(e){} });
}
function toggleTheme(){
  const current = appState.settings.theme === "system"
    ? (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light")
    : appState.settings.theme;
  appState.settings.theme = current === "dark" ? "light" : "dark";
  saveSettings();
  applyTheme();
}

function currentNip(){ return appState.profile?.nip; }

function loadJournalsFromDevice(){
  const list = loadLocal(STORAGE_KEYS.JOURNALS, []);
  appState.journals = (Array.isArray(list) ? list : []).map(normalizeJournal);
  return appState.journals;
}
function persistJournals(){ saveLocal(STORAGE_KEYS.JOURNALS, appState.journals); }

function normalizeJournal(j){
  return {
    journalId: j.journalId || j.id || uid("jrn"),
    nip: j.nip || currentNip(),
    tanggal: j.tanggal || j.date || todayISO(),
    jamKe: j.jamKe || j.jam || "",
    mataPelajaran: j.mataPelajaran || appState.profile?.mataPelajaran || "",
    kelas: j.kelas || "",
    materi: j.materi || "",
    catatan: j.catatan || j.hambatan || "",
    tindakLanjut: j.tindakLanjut || "",
    status: j.status || "Selesai",
    namaGuru: j.namaGuru || appState.profile?.namaGuru || ""
  };
}

function saveJournal(payload, isEdit){
  if (isEdit){
    const idx = appState.journals.findIndex(j=>j.journalId===payload.journalId);
    if (idx>-1) appState.journals[idx] = normalizeJournal(payload);
    notifySuccess("Jurnal diperbarui.");
  } else {
    appState.journals.unshift(normalizeJournal(payload));
    notifySuccess("Jurnal tersimpan.");
  }
  persistJournals();
  return true;
}

async function deleteJournal(journalId){
  const ok = await confirmDialog("Hapus Jurnal?", "Data absensi & nilai terkait pada jurnal ini akan ikut terhapus dari perangkat. Tindakan ini tidak dapat dibatalkan.", "Ya, Hapus");
  if (!ok) return false;
  appState.journals = appState.journals.filter(j=>j.journalId !== journalId);
  appState.attendance = appState.attendance.filter(a=>a.journalId !== journalId);
  appState.scores = appState.scores.filter(s=>s.journalId !== journalId);
  persistJournals(); persistAttendance(); persistScores();
  notifySuccess("Jurnal dihapus.");
  renderPage();
  return true;
}

function getJournalById(id){ return appState.journals.find(j=>j.journalId===id); }

  const kelasOptions = ['<option value="">Semua Kelas</option>']

  return `

function emptyStateHtml(emoji, title, btnLabel, btnId){
  return `<div class="empty-state">
    <div class="es-emoji">${emoji}</div>
    <div class="es-title">${title}</div>
    ${btnLabel ? `<button class="btn btn-primary" id="${btnId}">${btnLabel}</button>` : ""}
  </div>`;
}

function filterJournals(){
  let list = appState.journals.slice();
  const s = journalFilters.search.trim().toLowerCase();
  if (s) list = list.filter(j =>
    (j.materi||"").toLowerCase().includes(s) ||
    (j.kelas||"").toLowerCase().includes(s) ||
    (j.tanggal||"").includes(s)
  );
  if (journalFilters.kelas) list = list.filter(j=>j.kelas===journalFilters.kelas);
  if (journalFilters.bulan) list = list.filter(j=> (j.tanggal||"").slice(5,7)===journalFilters.bulan);
  if (journalFilters.status) list = list.filter(j=>j.status===journalFilters.status);
  list.sort((a,b)=> journalFilters.sort==="terbaru" ? (b.tanggal||"").localeCompare(a.tanggal||"") : (a.tanggal||"").localeCompare(b.tanggal||""));
  return list;
}

function bindJournalListEvents(){
  const searchInput = $("#jf-search");
  if (searchInput) searchInput.addEventListener("input", debounce(e=>{ journalFilters.search = e.target.value; renderPage(); }, 300));
  const kelasSel = $("#jf-kelas"); if (kelasSel) kelasSel.addEventListener("change", e=>{ journalFilters.kelas = e.target.value; renderPage(); });
  const bulanSel = $("#jf-bulan"); if (bulanSel) bulanSel.addEventListener("change", e=>{ journalFilters.bulan = e.target.value; renderPage(); });
  const statusSel = $("#jf-status"); if (statusSel) statusSel.addEventListener("change", e=>{ journalFilters.status = e.target.value; renderPage(); });
  const sortSel = $("#jf-sort"); if (sortSel) sortSel.addEventListener("change", e=>{ journalFilters.sort = e.target.value; renderPage(); });

  const addBtn = $("#btn-add-journal"); if (addBtn) addBtn.addEventListener("click", ()=>openJournalModal(null));
  ["btn-empty-add-journal","btn-empty-add-journal-m"].forEach(id=>{
    const b = $("#"+id); if (b) b.addEventListener("click", ()=>openJournalModal(null));
  });

  $$('[data-act]').forEach(btn=>{
    btn.addEventListener("click", ()=>{
      const id = btn.dataset.id;
      const act = btn.dataset.act;
      const j = getJournalById(id);
      if (!j) return;
      if (act==="edit") openJournalModal(j);
      else if (act==="delete") deleteJournal(id);
      else if (act==="att") openAttendanceModal(j);
      else if (act==="score") openScoreModal(j);
      else if (act==="detail") openJournalDetailModal(j);
    });
  });
}

const DRAFT_KEY = "jhgd_journal_draft";

function openModal(html, size=""){
  const root = $("#modal-root");
  root.innerHTML = `<div class="modal-backdrop" id="modal-backdrop"><div class="modal ${size}">${html}</div></div>`;
  $("#modal-backdrop").addEventListener("click", (e)=>{ if (e.target.id==="modal-backdrop") closeModal(); });
  document.addEventListener("keydown", escCloseHandler);
}
function escCloseHandler(e){ if (e.key==="Escape") closeModal(); }
function closeModal(){
  $("#modal-root").innerHTML = "";
  document.removeEventListener("keydown", escCloseHandler);
}

function classOptionsHtml(selected){
  return ['<option value="">Pilih Kelas</option>']
    .concat(appState.classes.map(k=>`<option value="${escapeHtml(k)}" ${selected===k?'selected':''}>${escapeHtml(k)}</option>`)).join("");
}

    kelas: $("#jf-kelas-input")?.value, materi: $("#jf-materi")?.value, catatan: $("#jf-catatan")?.value,

async function submitJournalForm(existing){
  const tanggal = $("#jf-tanggal").value;
  const jamKe = $("#jf-jamke").value.trim();
  const mataPelajaran = $("#jf-mapel").value.trim();
  const kelas = $("#jf-kelas-input").value;
  const materi = $("#jf-materi").value.trim();
  const catatan = $("#jf-catatan").value.trim();
  const tindakLanjut = $("#jf-lanjut").value.trim();
  const status = $("#jf-status").value;

  if (!tanggal || !jamKe || !mataPelajaran || !kelas || !materi){
    return notifyWarning("Mohon lengkapi seluruh field wajib.");
  }

  const payload = {
    journalId: existing ? existing.journalId : uid("jrn"),
    nip: currentNip(),
    namaGuru: appState.profile?.namaGuru,
    tanggal, jamKe, mataPelajaran, kelas, materi, catatan, tindakLanjut, status
  };

  if (success){
    removeLocal(DRAFT_KEY);
    closeModal();
    renderPage();
  }
}

function loadAttendanceFromDevice(){
  appState.attendance = loadLocal(STORAGE_KEYS.ATTENDANCE, []) || [];
  return appState.attendance;
}
function persistAttendance(){ saveLocal(STORAGE_KEYS.ATTENDANCE, appState.attendance); }

const STATUS_LABEL = { H:"Hadir", I:"Izin", S:"Sakit", A:"Alpa" };
const STATUS_BADGE_CLASS = { H:"badge-green", I:"badge-blue", S:"badge-yellow", A:"badge-red" };

function calculateAttendanceSummary(list){
  const s = { hadir:0, izin:0, sakit:0, alpa:0 };
  list.forEach(a=>{
    if (a.status==="H") s.hadir++;
    else if (a.status==="I") s.izin++;
    else if (a.status==="S") s.sakit++;
    else if (a.status==="A") s.alpa++;
  });
  return s;
}

/** Ambil status kehadiran seorang siswa pada jurnal tertentu ("-" jika belum diisi). */
function getAttendanceStatusFor(journalId, nama){
  const rec = appState.attendance.find(a=>a.journalId===journalId && a.nama===nama);
  return rec ? rec.status : null;
}
function attendanceStatusBadgeHtml(status){
  if (!status) return `<span class="badge badge-gray">-</span>`;
  return `<span class="badge ${STATUS_BADGE_CLASS[status]||'badge-gray'}">${STATUS_LABEL[status]||status}</span>`;
}

let attSessionState = { journal:null, records:[], search:"" };

function openAttendanceModal(journal){
  const studentsInClass = appState.students.filter(s=>s.kelas===journal.kelas);
  if (!studentsInClass.length){
    return notifyWarning("Data siswa untuk kelas " + journal.kelas + " tidak ditemukan. Coba ambil data siswa terlebih dahulu.");
  }
  // Performa: bangun Map sekali (O(n)) alih-alih Array.find di dalam loop (O(n*m)).
  const existingMap = new Map();
  appState.attendance
    .filter(a=>a.journalId===journal.journalId)
    .forEach(a=> existingMap.set(a.nama, a));
  attSessionState.journal = journal;
  attSessionState.search = "";
  attSessionState.records = studentsInClass.map(st=>{
    const found = existingMap.get(st.nama);
    return { nama:st.nama, jenisKelamin:st.jenisKelamin, status: found?.status || "H" };
  });
  renderAttendanceModalBody();
}

function renderAttendanceModalBody(){
  const j = attSessionState.journal;
  const summary = calculateAttendanceSummary(attSessionState.records);
  const filtered = attSessionState.records.filter(r=> r.nama.toLowerCase().includes(attSessionState.search.toLowerCase()));

  const rowsHtml = filtered.map((r,idx)=>`
    <tr data-nama="${escapeHtml(r.nama)}">

      <td>
        <div class="att-status-btns">
          ${["H","I","S","A"].map(code=>`<button type="button" class="st-btn ${r.status===code?'active-'+code.toLowerCase():''}" data-code="${code}" data-nama="${escapeHtml(r.nama)}">${code}</button>`).join("")}
        </div>
      </td>
    </tr>
  `).join("");

  openModal(`
    <div class="modal-head"><h3>Absensi Kelas ${escapeHtml(j.kelas)}</h3><button class="modal-close" id="am-close">✕</button></div>
    <div class="modal-body">
      <div class="small-muted" style="margin-bottom:12px; line-height:1.7;">
        <b>Tanggal:</b> ${formatDateID(j.tanggal)} &nbsp;·&nbsp; <b>Mapel:</b> ${escapeHtml(j.mataPelajaran)} &nbsp;·&nbsp;
        <b>Jam Ke:</b> ${escapeHtml(j.jamKe)} &nbsp;·&nbsp; <b>Materi:</b> ${escapeHtml(j.materi)} &nbsp;·&nbsp;
        <b>Jumlah Siswa:</b> ${attSessionState.records.length}

        <div class="att-chip att-i">🔵 <div class="n" id="sum-i">${summary.izin}</div>Izin</div>
        <div class="att-chip att-s">🟡 <div class="n" id="sum-s">${summary.sakit}</div>Sakit</div>
        <div class="att-chip att-a">🔴 <div class="n" id="sum-a">${summary.alpa}</div>Alpa</div>
      </div>
      <div class="toolbar">
        <button class="btn btn-secondary btn-sm" id="btn-set-h">SET SEMUA HADIR</button>
        <button class="btn btn-secondary btn-sm" id="btn-set-i">SET SEMUA IZIN</button>
        <button class="btn btn-secondary btn-sm" id="btn-set-s">SET SEMUA SAKIT</button>
        <button class="btn btn-secondary btn-sm" id="btn-set-a">SET SEMUA ALPA</button>
      </div>
      <div class="search-box" style="margin-bottom:12px;"><span class="ico">🔎</span><input type="text" id="att-search" placeholder="Cari nama siswa..." value="${escapeHtml(attSessionState.search)}"></div>

        <table><thead><tr><th>No</th><th>Nama</th><th>L/P</th><th>Status</th></tr></thead>

    </div>
  `, "modal-lg");

  $("#am-close").addEventListener("click", closeModal);
  $("#am-cancel").addEventListener("click", closeModal);
  $("#am-save").addEventListener("click", submitAttendance);

  $$(".st-btn").forEach(btn=>{

      const rec = attSessionState.records.find(r=>r.nama===btn.dataset.nama);
      if (rec) rec.status = btn.dataset.code;
      renderAttendanceModalBody();
      // restore focus to search if it had focus previously is skipped for simplicity
    });
  });

  const bulkSet = async (code, label) => {
    const ok = await confirmDialog(`${label}?`, `Seluruh siswa (${attSessionState.records.length}) akan ditandai "${label}".`, "Ya, Terapkan");
    if (!ok) return;
    attSessionState.records.forEach(r=> r.status = code);
    renderAttendanceModalBody();

  $("#btn-set-h").addEventListener("click", ()=>bulkSet("H","Hadir"));

function loadScoresFromDevice(){

}

const SCORE_CATEGORIES = ["Tugas","Sikap","Keaktifan","Ulangan"];
let scoreSessionState = { journal:null, category:"Tugas", records:[], search:"" };

function openScoreModal(journal){
  const studentsInClass = appState.students.filter(s=>s.kelas===journal.kelas);
  if (!studentsInClass.length){
    return notifyWarning("Data siswa untuk kelas " + journal.kelas + " tidak ditemukan. Coba ambil data siswa terlebih dahulu.");
  }
  scoreSessionState.journal = journal;
  scoreSessionState.category = "Tugas";
  scoreSessionState.search = "";
  loadScoreRecordsForCategory();
  renderScoreModalBody();
}

function loadScoreRecordsForCategory(){
  const j = scoreSessionState.journal;
  // Performa: Map O(1) untuk nilai yang sudah ada, dan Map untuk status kehadiran
  // (dipakai untuk menampilkan status kehadiran disamping nama siswa — poin 6).
  const existingMap = new Map();
  appState.scores
    .filter(s=>s.journalId===j.journalId && s.kategori===scoreSessionState.category)
    .forEach(s=> existingMap.set(s.nama, s));
  const attMap = new Map();
  appState.attendance
    .filter(a=>a.journalId===j.journalId)
    .forEach(a=> attMap.set(a.nama, a.status));

  scoreSessionState.records = appState.students.filter(s=>s.kelas===j.kelas).map(st=>{
    const found = existingMap.get(st.nama);
    return {
      nama:st.nama, jenisKelamin:st.jenisKelamin,
      nilai: found ? Number(found.nilai) : "", keterangan: found?.keterangan || "",
      kehadiran: attMap.get(st.nama) || null
    };
  });
}

function scoreAnalysis(records){
  const values = records.map(r=>Number(r.nilai)).filter(v=>!isNaN(v) && r_valid(v));
  function r_valid(v){ return v!==""; }
  const nums = records.map(r=>r.nilai).filter(v=>v!=="" && v!==null && v!==undefined).map(Number);
  if (!nums.length) return { max:"-", min:"-", avg:"-", count:0, passCount:0, failCount:0 };
  const passGrade = appState.settings.passGrade || 75;
  return {
    max: Math.max(...nums), min: Math.min(...nums),
    avg: (nums.reduce((a,b)=>a+b,0)/nums.length).toFixed(1),
    count: nums.length,
    passCount: nums.filter(n=>n>=passGrade).length,
    failCount: nums.filter(n=>n<passGrade).length
  };
}

function renderScoreModalBody(){
  const j = scoreSessionState.journal;
  const filtered = scoreSessionState.records.filter(r=>r.nama.toLowerCase().includes(scoreSessionState.search.toLowerCase()));

  openModal(`

    <div class="modal-body">

        <select id="score-category">${SCORE_CATEGORIES.map(c=>`<option value="${c}" ${scoreSessionState.category===c?'selected':''}>${c}</option>`).join("")}</select>
        <div class="field" style="margin:0; display:flex; align-items:center; gap:8px;">

        </div>
      </div>
      <div class="search-box" style="margin-bottom:12px;"><span class="ico">🔎</span><input type="text" id="score-search" placeholder="Cari nama siswa..." value="${escapeHtml(scoreSessionState.search)}"></div>
      <p class="small-muted" style="margin:-4px 0 10px;">Status kehadiran ditampilkan di samping nama sesuai jurnal ini.</p>
      <div class="table-wrap">
        <table><thead><tr><th>No</th><th>Nama</th><th>L/P</th><th>Nilai</th><th>Keterangan</th></tr></thead>
        <tbody id="score-tbody">${rowsHtml}</tbody></table>
      </div>
      <hr style="margin:16px 0;border-color:var(--border);">
      <div class="stat-grid" style="grid-template-columns:repeat(3,1fr);">
        <div class="stat-card"><div class="sv">${analysis.max}</div><div class="sl">Nilai Tertinggi</div></div>
        <div class="stat-card"><div class="sv">${analysis.min}</div><div class="sl">Nilai Terendah</div></div>
        <div class="stat-card"><div class="sv">${analysis.avg}</div><div class="sl">Rata-rata</div></div>
        <div class="stat-card"><div class="sv">${analysis.count}</div><div class="sl">Jumlah Siswa Dinilai</div></div>
        <div class="stat-card"><div class="sv" style="color:var(--green);">${analysis.passCount}</div><div class="sl">Tuntas (≥${appState.settings.passGrade||75})</div></div>
        <div class="stat-card"><div class="sv" style="color:var(--red);">${analysis.failCount}</div><div class="sl">Perlu Bimbingan</div></div>
      </div>

      <button class="btn btn-outline" id="sm-cancel">Batal</button>
      <button class="btn btn-primary" id="sm-save">Simpan Nilai</button>
    </div>
  `, "modal-lg");

  $("#sm-close").addEventListener("click", closeModal);
  $("#sm-cancel").addEventListener("click", closeModal);
  $("#score-search").addEventListener("input", debounce(e=>{ syncScoreInputsToState(); scoreSessionState.search = e.target.value; renderScoreModalBody(); }, 250));
  $("#score-category").addEventListener("change", e=>{ syncScoreInputsToState(); scoreSessionState.category = e.target.value; loadScoreRecordsForCategory(); renderScoreModalBody(); });

  $$(".score-input").forEach(inp=>{
    inp.addEventListener("input", ()=>{
      let v = inp.value;
      if (v !== "") {
        v = Math.max(0, Math.min(100, Number(v)));
        inp.value = v;
      }
      const rec = scoreSessionState.records.find(r=>r.nama===inp.dataset.nama);
      if (rec) rec.nilai = v;
      refreshScoreAnalysisBox();
    });
  });
  $$(".score-ket").forEach(inp=>{
    inp.addEventListener("input", ()=>{
      const rec = scoreSessionState.records.find(r=>r.nama===inp.dataset.nama);
      if (rec) rec.keterangan = inp.value;
    });
  });
  $("#btn-bulk-fill").addEventListener("click", ()=>{
    const val = $("#bulk-score-value").value;
    if (val === "" || Number(val) < 0 || Number(val) > 100) return notifyWarning("Masukkan nilai 0-100 untuk diterapkan ke semua siswa.");
    scoreSessionState.records.forEach(r=> r.nilai = Number(val));
    renderScoreModalBody();

function syncScoreInputsToState(){
  $$(".score-input").forEach(inp=>{
    const rec = scoreSessionState.records.find(r=>r.nama===inp.dataset.nama);
    if (rec && inp.value !== "") rec.nilai = Number(inp.value);
  });
}
function refreshScoreAnalysisBox(){
  const analysis = scoreAnalysis(scoreSessionState.records);
  const box = $("#score-tbody")?.closest(".modal-body");
  if (!box) return;
  const cards = $$(".stat-card .sv", box);
  if (cards.length >= 6){
    cards[0].textContent = analysis.max; cards[1].textContent = analysis.min; cards[2].textContent = analysis.avg;
    cards[3].textContent = analysis.count; cards[4].textContent = analysis.passCount; cards[5].textContent = analysis.failCount;
  }
}

function submitScores(){
  const j = scoreSessionState.journal;
  const validRecords = scoreSessionState.records.filter(r=> r.nilai !== "" && r.nilai !== null && !isNaN(Number(r.nilai)));
  if (!validRecords.length) return notifyWarning("Masukkan minimal satu nilai sebelum menyimpan.");

  appState.scores = appState.scores.filter(s=>!(s.journalId===j.journalId && s.kategori===scoreSessionState.category));

    appState.scores.push({ journalId:j.journalId, kategori:scoreSessionState.category, kelas:j.kelas, tanggal:j.tanggal, nama:r.nama, jenisKelamin:r.jenisKelamin, nilai:Number(r.nilai), keterangan:r.keterangan||"" });

  const now = new Date();
  const pad = n => String(n).padStart(2,'0');
  const toISO = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
  if (periode === "hari_ini") return { dari: todayISO(), sampai: todayISO() };
  if (periode === "minggu_ini"){
    const day = (now.getDay()+6)%7;
    const start = new Date(now); start.setDate(now.getDate()-day);
    return { dari: toISO(start), sampai: todayISO() };
  }
  if (periode === "bulan_ini"){
    const start = new Date(now.getFullYear(), now.getMonth(), 1);
    return { dari: toISO(start), sampai: todayISO() };
  }
  if (periode === "semester_ini"){
    const startMonth = now.getMonth() < 6 ? 0 : 6;
    const start = new Date(now.getFullYear(), startMonth, 1);
    return { dari: toISO(start), sampai: todayISO() };
  }
  return { dari: recapFilters.dari, sampai: recapFilters.sampai };
}

function getRecapDateRange(){
  if (recapFilters.periode === "custom") return { dari: recapFilters.dari, sampai: recapFilters.sampai };
  return periodeToRange(recapFilters.periode);
}

function filterJournalsForRecap(){
  const { dari, sampai } = getRecapDateRange();
  return appState.journals.filter(j=>{
    if (dari && j.tanggal < dari) return false;
    if (sampai && j.tanggal > sampai) return false;
    if (recapFilters.kelas && j.kelas !== recapFilters.kelas) return false;
    return true;
  });
}

function renderRecapAbsensi(){
  const journals = filterJournalsForRecap();
  const journalIds = new Set(journals.map(j=>j.journalId));
  const journalById = {}; journals.forEach(j=> journalById[j.journalId]=j);
  const rows = appState.attendance.filter(a=>journalIds.has(a.journalId));
  if (!rows.length) return `<div class="card">${emptyStateHtml("👥","Belum ada data absensi pada rentang ini.")}</div>`;

  // group per siswa+kelas to compute percentage across selected journals
  const perStudent = {};
  rows.forEach(a=>{
    const key = a.nama + "|" + a.kelas;
    perStudent[key] = perStudent[key] || { nama:a.nama, kelas:a.kelas, hadir:0, izin:0, sakit:0, alpa:0, total:0 };
    perStudent[key].total++;
    if (a.status==="H") perStudent[key].hadir++;
    else if (a.status==="I") perStudent[key].izin++;
    else if (a.status==="S") perStudent[key].sakit++;
    else if (a.status==="A") perStudent[key].alpa++;
  });
  const list = Object.values(perStudent).sort((a,b)=> a.nama.localeCompare(b.nama));

  return `<div class="card"><div class="table-wrap"><table>
    <thead><tr><th>No</th><th>Kelas</th><th>Nama Siswa</th><th>Hadir</th><th>Izin</th><th>Sakit</th><th>Alpa</th><th>% Kehadiran</th></tr></thead>
    <tbody>${list.map((r,i)=>{
      const pct = r.total ? Math.round((r.hadir/r.total)*100) : 0;
      const badge = pct>=90 ? '🟢' : pct>=75 ? '🟡' : '🔴';
      return `<tr><td>${i+1}</td><td>${escapeHtml(r.kelas)}</td><td>${escapeHtml(r.nama)}</td><td>${r.hadir}</td><td>${r.izin}</td><td>${r.sakit}</td><td>${r.alpa}</td><td>${badge} ${pct}%</td></tr>`;
    }).join("")}</tbody>
  </table></div></div>`;
}

function renderRecapNilai(){
  const journals = filterJournalsForRecap();
  const journalIds = new Set(journals.map(j=>j.journalId));
  const rows = appState.scores.filter(s=>journalIds.has(s.journalId));
  if (!rows.length) return `<div class="card">${emptyStateHtml("📝","Belum ada data nilai pada rentang ini.")}</div>`;

  const perStudent = {};
  rows.forEach(s=>{
    const key = s.nama;
    perStudent[key] = perStudent[key] || { nama:s.nama, Tugas:[], Sikap:[], Keaktifan:[], Ulangan:[] };
    if (perStudent[key][s.kategori]) perStudent[key][s.kategori].push(Number(s.nilai));
  });
  const avg = arr => arr.length ? (arr.reduce((a,b)=>a+b,0)/arr.length) : null;
  const passGrade = appState.settings.passGrade || 75;
  let list = Object.values(perStudent).map(r=>{
    const catAvgs = SCORE_CATEGORIES.map(c=> avg(r[c]));
    const validAvgs = catAvgs.filter(v=>v!==null);
    const overall = validAvgs.length ? (validAvgs.reduce((a,b)=>a+b,0)/validAvgs.length) : null;
    return { nama:r.nama, catAvgs, overall };
  }).filter(r=>r.overall!==null);
  list.sort((a,b)=> b.overall - a.overall);

  return `<div class="card"><div class="table-wrap"><table>
    <thead><tr><th>Rank</th><th>Nama Siswa</th>${SCORE_CATEGORIES.map(c=>`<th>${c}</th>`).join("")}<th>Rata-rata</th><th>Status</th></tr></thead>
    <tbody>${list.map((r,i)=>{
      const statusBadge = r.overall >= passGrade
        ? `<span class="badge badge-green">Tuntas</span>` : `<span class="badge badge-red">Perlu Bimbingan</span>`;
      return `<tr><td>${i+1}</td><td>${escapeHtml(r.nama)}</td>${r.catAvgs.map(v=>`<td>${v!==null?v.toFixed(1):'-'}</td>`).join("")}<td><b>${r.overall.toFixed(1)}</b></td><td>${statusBadge}</td></tr>`;
    }).join("")}</tbody>
  </table></div></div>`;
}

function buildExportRows(){
  if (recapFilters.jenis === "jurnal"){
    return filterJournalsForRecap().map((j,i)=>({ No:i+1, Tanggal:j.tanggal, Kelas:j.kelas, Mapel:j.mataPelajaran, Materi:j.materi, Status:j.status }));
  }
  if (recapFilters.jenis === "absensi"){
    const journals = filterJournalsForRecap();
    const journalIds = new Set(journals.map(j=>j.journalId));
    const rows = appState.attendance.filter(a=>journalIds.has(a.journalId));
    const perStudent = {};
    rows.forEach(a=>{
      const key = a.nama + "|" + a.kelas;
      perStudent[key] = perStudent[key] || { Nama:a.nama, Kelas:a.kelas, Hadir:0, Izin:0, Sakit:0, Alpa:0, total:0 };
      perStudent[key].total++;
      if (a.status==="H") perStudent[key].Hadir++;
      else if (a.status==="I") perStudent[key].Izin++;
      else if (a.status==="S") perStudent[key].Sakit++;
      else if (a.status==="A") perStudent[key].Alpa++;
    });
    return Object.values(perStudent).map(r=>({ ...r, "% Kehadiran": r.total ? Math.round((r.Hadir/r.total)*100)+"%" : "0%", total: undefined }));
  }
  // nilai
  const journals = filterJournalsForRecap();
  const journalIds = new Set(journals.map(j=>j.journalId));
  const rows = appState.scores.filter(s=>journalIds.has(s.journalId));
  const perStudent = {};
  rows.forEach(s=>{
    perStudent[s.nama] = perStudent[s.nama] || { Nama:s.nama, Tugas:[], Sikap:[], Keaktifan:[], Ulangan:[] };
    if (perStudent[s.nama][s.kategori]) perStudent[s.nama][s.kategori].push(Number(s.nilai));
  });
  const avg = arr => arr.length ? +(arr.reduce((a,b)=>a+b,0)/arr.length).toFixed(1) : "-";
  return Object.values(perStudent).map(r=>({
    Nama:r.Nama, Tugas:avg(r.Tugas), Sikap:avg(r.Sikap), Keaktifan:avg(r.Keaktifan), Ulangan:avg(r.Ulangan)
  }));
}

function exportFileNameBase(){
  const nama = (appState.profile?.namaGuru || "Guru").replace(/[^a-zA-Z0-9]+/g,"_");

}

function exportRecapToExcel(){
  if (!window.XLSX) return notifyError("Library Excel belum tersedia. Silakan coba kembali.");
  const rows = buildExportRows();
  if (!rows.length) return notifyWarning("Tidak ada data untuk diekspor pada filter ini.");
  showLoading("Menyiapkan file Excel...");
  try {
    const wb = XLSX.utils.book_new();
    const ws = XLSX.utils.json_to_sheet(rows);
    const sheetName = recapFilters.jenis === "jurnal" ? "Rekap Jurnal" : recapFilters.jenis === "absensi" ? "Rekap Absensi" : "Rekap Nilai";
    XLSX.utils.book_append_sheet(wb, ws, sheetName);
    XLSX.writeFile(wb, exportFileNameBase() + ".xlsx");
    notifySuccess("Export Excel berhasil.");
  } catch(e){
    console.error(e);
    notifyError("Library Excel belum tersedia. Silakan coba kembali.");
  } finally { hideLoading(); }
}

function exportRecapToCSV(){
  const rows = buildExportRows();
  if (!rows.length) return notifyWarning("Tidak ada data untuk diekspor pada filter ini.");
  const headers = Object.keys(rows[0]);
  const csvLines = [headers.join(",")].concat(
    rows.map(r => headers.map(h=>{
      const v = r[h] === undefined || r[h] === null ? "" : String(r[h]);
      return '"' + v.replace(/"/g,'""') + '"';
    }).join(","))
  );
  const blob = new Blob([csvLines.join("\n")], { type:"text/csv;charset=utf-8;" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = exportFileNameBase() + ".csv";
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
  notifySuccess("Download CSV berhasil.");
}

      <button class="btn btn-primary" id="btn-backup-export">💾 Export Backup (.json)</button>
    </div>
    <div class="card" style="max-width:600px;">
      <h3 class="card-title" style="margin-bottom:6px;">Import Backup</h3>
      <p class="small-muted" style="margin-bottom:14px;">Pilih file backup JSON untuk memulihkan seluruh data ke perangkat ini.</p>
      <input type="file" id="backup-file-input" accept="application/json" style="margin-bottom:14px;">
      <div>
        <button class="btn btn-secondary" id="btn-backup-import">📤 Restore dari File</button>
      </div>
      <p class="small-muted" style="margin-top:14px; color:var(--yellow);">⚠️ Aplikasi ini berjalan sepenuhnya offline. File backup adalah SATU-SATUNYA cara mengamankan atau memindahkan data Anda — lakukan secara berkala.</p>
    </div>
  `;
}

function bindBackupEvents(){
  $("#btn-backup-export").addEventListener("click", ()=>{
    const backup = {
      app: "Jurnal Harian Guru Digital",
      backupVersion: BACKUP_VERSION,
      exportedAt: new Date().toISOString(),
      profile: appState.profile,
      students: appState.students,
      journals: appState.journals,
      attendance: appState.attendance,
      scores: appState.scores,
      settings: appState.settings
    };
    const blob = new Blob([JSON.stringify(backup, null, 2)], { type:"application/json" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url; a.download = `Backup_JHGD_${todayISO()}.json`;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    URL.revokeObjectURL(url);
    notifySuccess("Backup berhasil diunduh.");
  });

  $("#btn-backup-import").addEventListener("click", async ()=>{
    const fileInput = $("#backup-file-input");
    const file = fileInput.files[0];
    if (!file) return notifyWarning("Pilih file backup terlebih dahulu.");
    try {
      const text = await file.text();
      const json = JSON.parse(text);
      const looksValid = json && typeof json === "object" &&
        ("journals" in json || "attendance" in json || "scores" in json || "students" in json || "profile" in json || "user" in json);
      if (!looksValid) throw new Error("format tidak valid");

      const ok = await confirmDialog(
        "Restore Backup?",
        "Seluruh data di perangkat ini (profil, data siswa, jurnal, absensi, nilai, pengaturan) akan DIGANTIKAN dengan isi file backup ini.",
        "Ya, Restore"
      );
      if (!ok) return;

      showLoading("Memulihkan data...");
      appState.profile = Object.assign({ namaGuru:"", nip:"", mataPelajaran:"" }, json.profile || json.user || {});
      appState.students = Array.isArray(json.students) ? json.students : appState.students;
      appState.journals = Array.isArray(json.journals) ? json.journals.map(normalizeJournal) : [];
      appState.attendance = Array.isArray(json.attendance) ? json.attendance : [];
      appState.scores = Array.isArray(json.scores) ? json.scores : [];
      if (json.settings) appState.settings = Object.assign(appState.settings, json.settings);

      // Satu kali tulis per jenis data (bukan berulang) untuk performa terbaik.
      persistProfile(); persistStudents(); persistJournals(); persistAttendance(); persistScores(); saveSettings();
      applyTheme();
      updateTopbarUser();
      hideLoading();
      fileInput.value = "";
      notifySuccess("Restore berhasil. Semua data telah dipulihkan ke perangkat.");
      navigateTo("dashboard");
    } catch(e){
      hideLoading();
      console.error(e);
      notifyError("File backup tidak valid atau rusak.");
    }
  });
}

      <h3 class="card-title" style="margin-bottom:4px; color:var(--red);">⚠️ Zona Berbahaya</h3>
      <p class="small-muted" style="margin:0 0 14px;">Menghapus SELURUH data aplikasi (jurnal, absensi, nilai, data siswa, dan profil) yang tersimpan di perangkat ini. Tindakan ini tidak dapat dibatalkan.</p>
      <button class="btn btn-danger btn-block" id="btn-hapus-semua-data">🗑️ Hapus Semua Data di Perangkat</button>
    </div>
  `;
}

function bindSettingsEvents(){
  $("#st-theme").addEventListener("change", e=>{ appState.settings.theme = e.target.value; saveSettings(); applyTheme(); });
  $("#st-passgrade").addEventListener("change", e=>{
    let v = Math.max(0, Math.min(100, Number(e.target.value)||75));
    appState.settings.passGrade = v; saveSettings(); notifySuccess("Batas ketuntasan diperbarui.");
  });
  $("#st-rows").addEventListener("change", e=>{ appState.settings.rowsPerPage = Number(e.target.value); saveSettings(); });
  $("#st-confirmdelete").addEventListener("change", e=>{ appState.settings.confirmDelete = e.target.checked; saveSettings(); });
  $("#btn-hapus-semua-data").addEventListener("click", handleDeleteAllData);
}

/**
 * Poin 8: Hapus data keseluruhan pada menu Pengaturan.
 * Menghapus seluruh data lokal (jurnal, absensi, nilai, siswa, profil) —
 * pengaturan aplikasi (tema dll.) sengaja dipertahankan.
 * Menggunakan konfirmasi ganda karena bersifat destruktif & permanen.
 */
async function handleDeleteAllData(){
  const step1 = await confirmDialog(
    "Hapus SEMUA Data?",
    "Seluruh data jurnal, absensi, nilai, data siswa, dan profil guru yang tersimpan di perangkat ini akan dihapus permanen. Sangat disarankan untuk Export Backup terlebih dahulu.",
    "Ya, Lanjutkan"
  );
  if (!step1) return;

  const step2 = await confirmDialog(
    "Konfirmasi Terakhir",
    "Tindakan ini TIDAK DAPAT DIBATALKAN. Apakah Anda benar-benar yakin ingin menghapus seluruh data aplikasi?",
    "Ya, Hapus Semua"
  );
  if (!step2) return;

  removeLocal(STORAGE_KEYS.PROFILE);
  removeLocal(STORAGE_KEYS.STUDENTS);
  removeLocal(STORAGE_KEYS.JOURNALS);
  removeLocal(STORAGE_KEYS.ATTENDANCE);
  removeLocal(STORAGE_KEYS.SCORES);
  removeLocal(DRAFT_KEY);

  appState.profile = { namaGuru:"", nip:"", mataPelajaran:"" };
  appState.students = [];
  appState.classes = [];
  appState.journals = [];
  appState.attendance = [];
  appState.scores = [];

  updateTopbarUser();
  notifySuccess("Seluruh data aplikasi telah dihapus dari perangkat.");
  navigateTo("dashboard");
}

/* =========================================================================
   21. GLOBAL SEARCH
   ========================================================================= */
function bindGlobalSearch(){
  const input = $("#global-search");
  const results = $("#gs-results");
  input.addEventListener("input", debounce(()=>{
    const q = input.value.trim().toLowerCase();
    if (!q){ results.classList.add("hidden"); results.innerHTML=""; return; }
    const items = [];
    appState.journals.forEach(j=>{
      if ((j.materi||"").toLowerCase().includes(q) || (j.kelas||"").toLowerCase().includes(q)){
        items.push({ type:"Jurnal", label:`${j.materi} — ${j.kelas}`, sub:formatDateShort(j.tanggal), action:()=>{ navigateTo("jurnal"); } });
      }
    });
    appState.students.forEach(s=>{
      if (s.nama.toLowerCase().includes(q)){
        items.push({ type:"Siswa", label:s.nama, sub:s.kelas, action:()=>{ navigateTo("jurnal"); journalFilters.kelas = s.kelas; } });
      }
    });
    appState.classes.forEach(k=>{
      if (k.toLowerCase().includes(q)){
        items.push({ type:"Kelas", label:k, sub:"Kelas", action:()=>{ navigateTo("jurnal"); journalFilters.kelas = k; renderPage(); } });
      }
    });
    if (!items.length){ results.innerHTML = `<div class="gs-item">Tidak ada hasil untuk "${escapeHtml(input.value)}"</div>`; results.classList.remove("hidden"); return; }
    results.innerHTML = items.slice(0,8).map((it,idx)=>`<div class="gs-item" data-idx="${idx}"><b>${it.type}</b>: ${escapeHtml(it.label)}<small>${escapeHtml(it.sub)}</small></div>`).join("");
    results.classList.remove("hidden");
    $$(".gs-item[data-idx]", results).forEach((elm,idx)=>{
      elm.addEventListener("click", ()=>{ items[idx].action(); results.classList.add("hidden"); input.value=""; });
    });
  }, 220));
  document.addEventListener("click", (e)=>{ if (!e.target.closest(".gsearch")) results.classList.add("hidden"); });
}

/* =========================================================================
   22. KEYBOARD SHORTCUTS
   ========================================================================= */
function bindKeyboardShortcuts(){
  document.addEventListener("keydown", (e)=>{
    const tag = (e.target.tagName || "").toLowerCase();
    const isTyping = tag === "input" || tag === "textarea" || e.target.isContentEditable;
    if (e.ctrlKey && e.key.toLowerCase()==="k"){
      e.preventDefault();
      if ($("#app-view").classList.contains("hidden")) return;
      $("#global-search")?.focus();
      return;
    }
    if (e.ctrlKey && e.key.toLowerCase()==="j"){
      if (isTyping) return;
      e.preventDefault();
      if ($("#app-view").classList.contains("hidden")) return;
      openJournalModal(null);
      return;
    }
    if (e.key === "Escape"){
      const results = $("#gs-results");
      if (results && !results.classList.contains("hidden")) results.classList.add("hidden");
    }
  });
}
